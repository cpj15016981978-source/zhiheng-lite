<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知衡 · 记忆健康</title>
<style>
:root{--bg:#0b141a;--panel:#101e27;--line:#223440;--text:#e6f0f6;--muted:#8fa6b6;--accent:#43d1b1;--warn:#ffb86b;--bad:#ff8d8d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:17px;margin:0}header a{margin-left:auto;color:var(--accent);text-decoration:none;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px}.muted{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.metric{background:#0b1820;border:1px solid var(--line);border-radius:10px;padding:12px}
.metric b{display:block;font-size:24px;color:var(--accent)}.metric span{font-size:12px;color:var(--muted)}
.issue{color:var(--warn);font-size:13px;margin-top:8px}
input,button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#0b1820;color:var(--text);padding:9px 10px}
input{width:70%}button{background:var(--accent);color:#06231d;border:0;font-weight:700;cursor:pointer}
.result{border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;background:#0c1a22;border-radius:0 8px 8px 0}
.result b{color:var(--accent);font-size:12px}.result .txt{white-space:pre-wrap;margin-top:3px}
</style>
</head>
<body>
<header><h1>记忆健康</h1><span class="muted">聊天全量落盘 · 自动分类 · 混合召回</span><a href="/chat">回聊天</a></header>
<main>
  <div class="card"><h2>概览</h2><div class="grid" id="stats"></div><div class="issue" id="issues"></div></div>
  <div class="card">
    <h2>记忆图谱</h2>
    <div class="muted">事实的 subject → predicate → object；只读。</div>
    <svg id="graph" viewBox="0 0 900 420" style="width:100%;height:auto;margin-top:10px;background:#0b1820;border:1px solid var(--line);border-radius:10px"></svg>
  </div>

  <div class="card">
    <h2>混合检索</h2>
    <div class="muted">记忆事实 + 记忆条目 + 全部聊天记录，按关键词/时间/语义基础分排序。</div>
    <div style="display:flex;gap:8px;margin-top:10px"><input id="q" placeholder="例如：报价 假设 / 会议 待办"><select id="mode"><option value="hybrid">混合</option><option value="keyword">关键词</option><option value="semantic">语义</option></select><button onclick="search()">搜索</button></div>
    <div id="results" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>自动记忆候选</h2>
    <div class="muted">扫描聊天里“我喜欢 / 记住 / 以后 / 每天”等句子，只生成候选，不自动写正式事实。</div>
    <button style="margin-top:10px" onclick="autoMemory()">从聊天提取候选</button>
    <span id="auto" class="muted"></span>
  </div>

  <div class="card">
    <h2>聊天记录分类</h2>
    <div class="muted">每条消息写入时自动打标；旧消息可在这里补分类。分类：work / task / research / decision / personal / emotion / question / other。</div>
    <button style="margin-top:10px" onclick="classify()">补分类</button>
    <span id="cls" class="muted"></span>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
  const d=await (await fetch('/api/memory/health')).json();
  const m=d.memory||{}, c=d.chat||{};
  const items=[['聊天消息',c.messages||0],['未分类',c.unclassified||0],['事实',m.facts||0],['情景',m.episodes||0],['重复事实',m.duplicate_facts||0],['过期事实',m.stale_facts_90d||0]];
  $('#stats').innerHTML=items.map(([k,v])=>`<div class="metric"><b>${v}</b><span>${k}</span></div>`).join('');
  $('#issues').textContent=(d.issues||[]).join(' · ')||'状态正常';
}
async function search(){
  const q=$('#q').value.trim(); if(!q) return;
  const mode=$('#mode').value;
  const d=await (await fetch('/api/memory/search?mode='+encodeURIComponent(mode)+'&q='+encodeURIComponent(q))).json();
  $('#results').innerHTML=(d.items||[]).map(x=>`<div class="result"><b>${esc(x.source)} / ${esc(x.kind)} · ${x.score}</b><div class="txt">${esc(x.text)}</div></div>`).join('')||'<div class="muted">没有命中</div>';
}
async function classify(){
  const r=await fetch('/api/memory/classify',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const d=await r.json(); $('#cls').textContent='已补分类 '+(d.updated||0)+' 条'; await load();
}
async function loadGraph(){
  const d=await (await fetch('/api/memory/graph')).json();
  const svg=$('#graph'); svg.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  const nodes=d.nodes||[], edges=d.edges||[];
  if(!nodes.length){ svg.innerHTML='<text x="20" y="40" fill="#8fa6b6">暂无事实</text>'; return; }
  const cx=450, cy=210, R=Math.min(170, 50+nodes.length*14);
  const pos={};
  nodes.forEach((n,i)=>{ const a=2*Math.PI*i/nodes.length; pos[n.id]={x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)}; });
  for(const e of edges){
    const a=pos[e.source],b=pos[e.target]; if(!a||!b) continue;
    const l=document.createElementNS(ns,'line');
    l.setAttribute('x1',a.x);l.setAttribute('y1',a.y);l.setAttribute('x2',b.x);l.setAttribute('y2',b.y);
    l.setAttribute('stroke','#31506a');l.setAttribute('stroke-width','1.2');svg.appendChild(l);
  }
  nodes.forEach(n=>{
    const p=pos[n.id];
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',13);
    c.setAttribute('fill',n.kind==='subject'?'#43d1b1':'#ffb86b');svg.appendChild(c);
    const t=document.createElementNS(ns,'text');
    t.setAttribute('x',p.x+17);t.setAttribute('y',p.y+4);t.setAttribute('fill','#e6f0f6');t.setAttribute('font-size','11');
    t.textContent=n.label;svg.appendChild(t);
  });
}
async function autoMemory(){
  const r=await fetch('/api/memory/auto',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  const d=await r.json(); $('#auto').textContent='扫描 '+(d.scanned||0)+' 条，新增候选 '+(d.added_count||0)+' 条，待批 '+(d.pending||0)+' 条';
}
load(); loadGraph();
</script>
</body>
</html>
