<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知衡 · MCP 市场</title>
<style>body{margin:0;background:#f5f2ec;color:#2a2722;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}main{max-width:980px;margin:0 auto;padding:24px}h1{font-size:18px;margin:0 0 4px}p{color:#80776a;font-size:12px;margin:0 0 16px}h2{font-size:15px;margin:20px 0 8px}.item{background:#fff;border:1px solid #d9d1c2;border-radius:10px;padding:10px;margin:8px 0}.row{display:flex;gap:8px;margin:6px 0}input{flex:1;padding:7px;border:1px solid #d9d1c2;border-radius:8px;background:#fff}button{border:1px solid #8a5a2b;background:#fff;color:#8a5a2b;border-radius:8px;padding:6px 10px;cursor:pointer}.muted{color:#80776a;font-size:12px}pre{white-space:pre-wrap;font-size:12px}</style></head>
<body><main><h1>MCP 市场</h1><p>本机 stdio 服务器；添加/删除写审计，工具调用仍走审批。</p><h2>已安装</h2><div id="list"></div>
<h2>添加服务器</h2><div class="item"><div class="row"><input id="name" placeholder="名称，例如 demo"/><input id="command" placeholder="python.exe 路径"/></div><div class="row"><input id="args" placeholder='参数 JSON，例如 ["server.py"]'/><input id="cwd" placeholder="工作目录（可空）"/></div><div class="row"><button id="add">添加</button><span id="msg" class="muted"></span></div></div>
</main><script>
async function load(){const r=await fetch('/api/mcp/servers');const d=await r.json();const rows=d.servers||[];document.querySelector('#list').innerHTML=rows.length?rows.map(x=>'<div class="item"><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.command)+' '+esc((x.args||[]).join(' '))+'</div><div class="row"><button data-tools="'+esc(x.name)+'">列工具</button><button data-del="'+esc(x.name)+'">删除</button></div><pre id="t-'+esc(x.name)+'"></pre></div>').join(''):'<p class="muted">暂无服务器</p>';document.querySelectorAll('button[data-del]').forEach(b=>b.onclick=async()=>{await fetch('/api/mcp/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'remove',name:b.dataset.del})});load();});document.querySelectorAll('button[data-tools]').forEach(b=>b.onclick=async()=>{const r=await fetch('/api/mcp/tools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({server:b.dataset.tools})});const d=await r.json();document.querySelector('#t-'+CSS.escape(b.dataset.tools)).textContent=JSON.stringify(d.tools||d,null,2);});}
document.querySelector('#add').onclick=async()=>{let args=[];try{args=JSON.parse(document.querySelector('#args').value||'[]')}catch(e){document.querySelector('#msg').textContent='参数不是 JSON';return}const r=await fetch('/api/mcp/servers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',name:document.querySelector('#name').value,command:document.querySelector('#command').value,args,cwd:document.querySelector('#cwd').value})});const d=await r.json();document.querySelector('#msg').textContent=r.ok?'已添加':'失败：'+(d.error||'');load();};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
load();
</script></body></html>
