<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知衡 · 文件审批</title>
<style>body{margin:0;background:#f5f2ec;color:#2a2722;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}main{max-width:980px;margin:0 auto;padding:24px}h1{font-size:18px;margin:0 0 4px}p{color:#80776a;font-size:12px;margin:0 0 16px}.item{background:#fff;border:1px solid #d9d1c2;border-radius:10px;padding:12px;margin:10px 0}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.muted{color:#80776a;font-size:12px}pre{white-space:pre-wrap;font-size:12px;max-height:220px;overflow:auto;background:#f7f5f0;padding:8px;border-radius:8px}button{border:1px solid #8a5a2b;background:#fff;color:#8a5a2b;border-radius:8px;padding:6px 10px;cursor:pointer}</style></head>
<body><main><h1>文件审批</h1><p>模型提议写文件时先在这里等；批准后才写入 workspace/，拒绝不写。</p><h2>收件箱导入</h2><div id="inbox" class="muted">加载中…</div><h2>待审批文件</h2><div id="list">加载中…</div></main>
<script>
async function loadInbox(){const r=await fetch('/api/inbox');const d=await r.json();const items=d.items||[];document.querySelector('#inbox').innerHTML=items.length?items.map(x=>'<div class="item"><div class="row"><b class="grow">'+esc(x.name)+'</b><span class="muted">'+Math.round((x.size||0)/1024)+'KB</span><button data-ingest="'+esc(x.name)+'">导入</button></div></div>').join(''):'<p class="muted">收件箱为空：把 PDF/Word/Excel/txt 放进 inbox/</p>';document.querySelectorAll('button[data-ingest]').forEach(b=>b.onclick=async()=>{const r=await fetch('/api/inbox/ingest',{method:'POST',headers:{'Content-Type':'application/json','X-DSH-Nonce': window.__DSH_NONCE__ || ''},body:JSON.stringify({name:b.dataset.ingest})});const d=await r.json();if(!r.ok)alert(d.error||'导入失败');else alert('已转成待审批：'+d.proposal.filename);loadInbox();load();});}
async function load(){const r=await fetch('/api/files/pending');const d=await r.json();const items=d.items||[];document.querySelector('#list').innerHTML=items.length?items.map(x=>'<div class="item"><div class="row"><b class="grow">'+esc(x.filename)+'</b><button data-ok="'+x.id+'">批准</button><button data-no="'+x.id+'">拒绝</button></div><div class="muted">#'+x.id+' · '+esc(x.created_at)+'</div><pre>'+esc(x.content).slice(0,4000)+'</pre></div>').join(''):'<p class="muted">暂无待审批文件</p>';document.querySelectorAll('button[data-ok]').forEach(b=>b.onclick=async()=>{const r=await fetch('/api/files/approve',{method:'POST',headers:{'Content-Type':'application/json','X-DSH-Nonce': window.__DSH_NONCE__ || ''},body:JSON.stringify({id:Number(b.dataset.ok)})});const d=await r.json();if(!r.ok)alert(d.error||'失败');load();});document.querySelectorAll('button[data-no]').forEach(b=>b.onclick=async()=>{await fetch('/api/files/reject',{method:'POST',headers:{'Content-Type':'application/json','X-DSH-Nonce': window.__DSH_NONCE__ || ''},body:JSON.stringify({id:Number(b.dataset.no)})});load();});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
loadInbox();load();
</script></body></html>
