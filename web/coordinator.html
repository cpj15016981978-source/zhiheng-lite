<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知衡 · 协调者</title>
<style>
body{margin:0;background:#f5f2ec;color:#2a2722;font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
main{max-width:920px;margin:0 auto;padding:24px}
h1{font-size:18px;margin:0 0 4px}p{color:#80776a;font-size:12px;margin:0 0 16px}
.card{background:#fff;border:1px solid #d9d1c2;border-radius:10px;padding:14px;margin:10px 0}
input,textarea{width:100%;box-sizing:border-box;padding:8px;border:1px solid #d9d1c2;border-radius:8px;background:#fff;margin:4px 0}
textarea{min-height:90px;font-family:inherit}
button{border:1px solid #8a5a2b;background:#fff;color:#8a5a2b;border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:#8a5a2b;color:#fff}
.step{padding:8px 0;border-top:1px solid #eee;font-size:12px}
.muted{color:#80776a;font-size:12px}.ok{color:#0d6b3b}.bad{color:#a3342a}
pre{white-space:pre-wrap;font-size:12px;background:#f7f5f0;padding:8px;border-radius:8px;max-height:220px;overflow:auto}
</style></head>
<body><main>
<h1>协调者</h1>
<p>顺序协调：目标 → 拆步骤 → 每步批准执行 → 结果与验收。写文件仍走 /files 审批。</p>
<div class="card">
  <input id="goal" placeholder="目标，例如：整理本周会议纪要并生成周报" />
  <textarea id="steps" placeholder="每行一步；只读用 read:文件 / list:目录 / summary:文件；写作用普通文字；留空由模型拆 3-6 步"></textarea>
  <button class="primary" id="start">生成协调计划</button>
  <span id="msg" class="muted"></span>
</div>
<div class="card" id="planCard" hidden>
  <b id="planTitle"></b> <span id="planState" class="muted"></span>
  <div id="stepsList"></div>
  <button class="primary" id="next">执行下一步</button>
  <button id="parallel">并行只读</button>
  <button id="resume">恢复失败步骤</button>
  <div id="trajectory"></div>
  <div id="result"></div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let current='';
async function api(path, body){
  const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json(); if(!r.ok) throw new Error(d.error||('HTTP '+r.status)); return d;
}
function render(d){
  const p=d.plan||d; if(!p||!p.id){return}
  current=p.id; $('#planCard').hidden=false;
  $('#planTitle').textContent=p.goal||'协调计划'; $('#planState').textContent='['+(p.status||'')+']';
  const jobs=d.jobs||[];
  $('#stepsList').innerHTML=jobs.map((j,i)=>'<div class="step"><b>'+(i+1)+'</b> ['+esc(j.status)+'] '+esc(j.title)+
    (j.result?'<div class="muted">'+esc(String(j.result).slice(0,300))+'</div>':'')+'</div>').join('')||'<div class="muted">尚无作业</div>';
  const tr=(d.trajectory||{}).steps||[];
  $('#trajectory').innerHTML=tr.length?'<div class="muted">轨迹</div>'+tr.map(t=>'<div class="step">['+esc(t.status)+'] '+
    esc(t.title)+' · '+esc(t.duration_ms)+'ms · cost '+esc(t.cost)+'<pre>'+esc(JSON.stringify(t.events||[],null,1))+'</pre></div>').join(''):'';
}
$('#start').onclick=async()=>{
  const goal=$('#goal').value.trim(); if(!goal){$('#msg').textContent='先写目标';return}
  $('#msg').textContent='拆解中…';
  try{const d=await api('/api/coordinator/start',{goal,steps:$('#steps').value});$('#msg').textContent='已生成 '+d.steps.length+' 步';render(await api('/api/coordinator/status?id='+encodeURIComponent(d.id)))}
  catch(e){$('#msg').textContent='失败：'+e.message}
};
$('#parallel').onclick=async()=>{if(!current)return;$('#result').textContent='并行只读中…';try{const d=await api('/api/coordinator/parallel',{id:current});$('#result').textContent='并行完成 '+d.parallel+' 步';render(d)}catch(e){$('#result').textContent='失败：'+e.message}};
$('#resume').onclick=async()=>{if(!current)return;try{const d=await api('/api/coordinator/resume',{id:current});$('#result').textContent='恢复 '+d.resumed+' 步';render(await api('/api/coordinator/status?id='+encodeURIComponent(current)))}catch(e){$('#result').textContent='失败：'+e.message}};
$('#next').onclick=async()=>{if(!current)return;$('#result').textContent='执行中…';try{const d=await api('/api/coordinator/step',{id:current});$('#result').innerHTML='<pre>'+esc(JSON.stringify(d.result,null,2))+'</pre>';render(d)}catch(e){$('#result').textContent='失败：'+e.message}};
</script></body></html>
