<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知衡 Lite</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #151412; color: #e9e3d6; font: 15px/1.7 system-ui, "Microsoft YaHei", sans-serif; }
  main { max-width: 860px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 18px 20px; border-bottom: 1px solid #2b2823; display: flex; justify-content: space-between; }
  header b { color: #d8c7a5; letter-spacing: 1px; }
  header span { color: #777; font-size: 12px; }
  #chat { flex: 1; padding: 20px; overflow: auto; }
  .msg { margin: 0 0 18px; white-space: pre-wrap; }
  .user { color: #9fc6c2; }
  .ai { color: #e9e3d6; }
  .meta { color: #666; font-size: 11px; margin-bottom: 4px; }
  footer { padding: 12px 20px 20px; border-top: 1px solid #2b2823; }
  textarea { width: 100%; background: #1d1b18; color: #e9e3d6; border: 1px solid #39342c; border-radius: 10px; padding: 12px; resize: none; min-height: 64px; }
  button { margin-top: 8px; background: #b48b57; color: #1a1712; border: 0; border-radius: 8px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; }
</style>
<main>
  <header><b>知衡 Lite</b><span id="model">本地模型 · 无记忆</span></header>
  <section id="chat"></section>
  <footer>
    <textarea id="input" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </footer>
</main>
<script>
  const chat = document.querySelector('#chat');
  const input = document.querySelector('#input');
  const sendBtn = document.querySelector('#send');
  const modelEl = document.querySelector('#model');
  let busy = false;
  const messages = []; // 只存在当前页面，不落库、不留档

  function add(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = '<div class="meta">' + (role === 'user' ? '你' : 'AI') + '</div>';
    const t = document.createElement('div');
    t.textContent = text;
    d.appendChild(t); chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = ''; add('user', text); messages.push({role: 'user', content: text});
    busy = true; sendBtn.disabled = true;
    try {
      const r = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages})});
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || '请求失败');
      add('ai', d.content || '（没有内容）');
      messages.push({role: 'assistant', content: d.content || ''});
    } catch (e) { add('ai', '错误：' + e.message); }
    finally { busy = false; sendBtn.disabled = false; input.focus(); }
  }

  sendBtn.onclick = send;
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  fetch('/api/health').then(r => r.json()).then(d => { modelEl.textContent = d.model + ' · 无记忆'; }).catch(() => {});
  input.focus();
</script>
</html>
