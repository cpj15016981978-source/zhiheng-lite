name: quality-gate

on:
  pull_request:
  push:
    branches: [main, master, dev-1.1.0]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps
        run: python -m pip install -r requirements.txt
      - name: Run governance gates
        # 干净 clone 没有本机板根/留底；contract 仍受运行器环境影响，先记录输出、不阻塞测试。
        continue-on-error: true
        run: python tools/gates.py --tier contract
      - name: Run backend regression
        timeout-minutes: 8
        shell: pwsh
        run: |
          python -m unittest tests.test_approval_boundary tests.test_agent_step tests.test_plan_loop tests.test_productization tests.test_webapp_aliases tests.test_low_spec_resources tests.test_console_encoding tests.test_web_client tests.test_inbox tests.test_skills_builtin tests.test_semantic_memory tests.test_web_ime_guard tests.test_tool_entry_surface 2>&1 | Tee-Object -FilePath ci-tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content ci-tests.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content ci-tests.log | Select-String -Pattern '^(FAIL|ERROR):' | ForEach-Object { Write-Host ("::error::" + $_.Line) }
            exit $code
          }
