name: quality-gate

on:
  pull_request:
  push:
    branches: [main, master, dev-1.1.0]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test deps
        run: python -m pip install -r requirements.txt
      - name: Run governance gates
        # contract 是纯逻辑门禁；红了必须拦，不再 continue-on-error。
        run: python tools/gates.py --tier contract
      - name: Run backend regression (full)
        timeout-minutes: 20
        shell: pwsh
        env:
          PAI_CI: "1"
        run: |
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | Tee-Object -FilePath ci-tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content ci-tests.log | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content ci-tests.log | Select-String -Pattern '^(FAIL|ERROR):' | ForEach-Object { Write-Host ("::error::" + $_.Line) }
            exit $code
          }
